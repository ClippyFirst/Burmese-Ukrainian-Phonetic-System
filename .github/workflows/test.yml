name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate independent IPA gold corpus structure
        run: python scripts/ipa_gold_corpus.py validate --language burmese
      - run: pip install -e ".[test]"
      - name: Verify installable wheel carries canonical IPA registries
        run: |
          mkdir -p "$RUNNER_TEMP/burmese-wheel"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/burmese-wheel" .
          python scripts/verify_python_wheel.py "$RUNNER_TEMP/burmese-wheel"
      - run: pytest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Fail on high-severity npm advisories
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Check generated web data is up to date
        run: npm run generate:web && git diff --exit-code -- src/web/generated/data.js
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:built
