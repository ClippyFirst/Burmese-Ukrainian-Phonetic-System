name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pull-request validation must not occupy/cancel the production Pages queue.
  # Keep each PR isolated; all main pushes share the production deployment group.
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The pinned 2017 OpenFst release is not compatible with GCC 15; use the
    # stable Ubuntu 22.04/GCC 11 toolchain for reproducible model generation.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: google/language-resources
          ref: a90601024f07ab7e96c911243324e0adeb16da96
          path: language-resources
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-version: "1.30.0"
          module-root: language-resources
      - name: Pin legacy Abseil dependency for reproducible Google WFST build
        working-directory: language-resources
        run: |
          python - <<'PY'
          from pathlib import Path
          workspace = Path("WORKSPACE")
          content = workspace.read_text(encoding="utf-8")
          old = '''http_archive(
              name = "com_google_absl",
              strip_prefix = "abseil-cpp-master",
              urls = ["https://github.com/abseil/abseil-cpp/archive/master.zip"],
          )
          '''
          new = '''git_repository(
              name = "com_google_absl",
              commit = "45fdade6c0415ec5af3f9312e6311a4ccc682a7b",
              remote = "https://github.com/abseil/abseil-cpp.git",
          )
          '''
          if old not in content:
              raise SystemExit("Expected unpinned Abseil WORKSPACE block was not found")
          workspace.write_text(content.replace(old, new), encoding="utf-8")
          PY
      - name: Build pinned Google Burmese WFST and OpenFst text tools
        working-directory: language-resources
        env:
          USE_BAZEL_VERSION: 7.4.1
        run: bazel build --noenable_bzlmod -c opt //my:g2p @openfst//:fstprint @openfst//:fstinfo
      - name: Validate pinned Google IPA symbol-table invariants
        working-directory: language-resources
        env:
          USE_BAZEL_VERSION: 7.4.1
        run: bazel test --noenable_bzlmod -c opt //my:ipa_phonemes_are_uniquely_decodable //my:phoneme_syms_is_current //my:phoneme_tsv_is_current
      - name: Verify browser input alphabet against Google's complete Burmese codepoint symbol table
        run: node scripts/validate_google_input_symbols.mjs language-resources/my/codepoint.syms
      - name: Export Google WFST as a static browser model
        run: |
          set -euo pipefail
          mkdir -p artifacts public/models
          FSTPRINT="$(cd language-resources && find -L bazel-bin -type f -name fstprint -print -quit)"
          FSTINFO="$(cd language-resources && find -L bazel-bin -type f -name fstinfo -print -quit)"
          test -n "$FSTPRINT" && test -n "$FSTINFO"
          (cd language-resources && "$FSTPRINT" --isymbols=my/codepoint.syms --osymbols=bazel-bin/my/ipa_phoneme.syms bazel-bin/my/G2P.fst) > artifacts/G2P.fst.txt
          (cd language-resources && "$FSTINFO" bazel-bin/my/G2P.fst) > artifacts/G2P.fst.info
          python scripts/export_google_wfst_model.py \
            --fst-print artifacts/G2P.fst.txt \
            --fst-info artifacts/G2P.fst.info \
            --fst-binary language-resources/bazel-bin/my/G2P.fst \
            --input-symbols language-resources/my/codepoint.syms \
            --output-symbols language-resources/bazel-bin/my/ipa_phoneme.syms \
            --output public/models/google-burmese-wfst.json \
            --source-commit a90601024f07ab7e96c911243324e0adeb16da96 \
            --openfst-commit 22867ee7b483598a729abe125da2517584a5d010 \
            --thrax-commit c65fb3d51f9bd0299503f3289a124f52c3431eeb
          python -c 'import json; m=json.load(open("public/models/google-burmese-wfst.json", encoding="utf-8")); assert m["available"] is True and m["arc_count"] > 0'
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
      - name: Verify browser WFST against upstream thrax_g2p CLI
        run: |
          printf '%s\n' 'ကေ' 'ကော်' 'မြန်' 'ယူ' > artifacts/google-wfst-inputs.txt
          (cd language-resources && bazel-bin/my/g2p < ../artifacts/google-wfst-inputs.txt) > artifacts/google-wfst-reference.tsv
          node scripts/verify_google_wfst_model_parity.mjs artifacts/google-wfst-reference.tsv
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:built
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed site and runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/index.html
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/system.html" -o /tmp/system.html
          grep -q 'id="source"' /tmp/index.html
          grep -q 'type="module"' /tmp/index.html
          grep -q 'src="./vendor/mya2rom/mya2rom.js' /tmp/index.html
          grep -q 'src="./vendor/mya2rom/romanisations.js' /tmp/index.html
          grep -q '<title>' /tmp/system.html
          script_src="$(grep -oE '<script type="module"[^>]*src="[^"]+\.js"' /tmp/index.html | sed -E 's/.*src="([^"]+)".*/\1/' | head -n1)"
          css_src="$(grep -oE 'href="[^"]+\.css([?][^"]*)?"' /tmp/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$script_src" && test -n "$css_src"
          case "$script_src" in http*) script_url="$script_src" ;; /*) script_url="$base$script_src" ;; *) script_url="$base/${script_src#./}" ;; esac
          case "$css_src" in http*) css_url="$css_src" ;; /*) css_url="$base$css_src" ;; *) css_url="$base/${css_src#./}" ;; esac
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$script_url" -o /tmp/app.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$css_url" -o /tmp/styles.css
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/vendor/mya2rom/mya2rom.js" -o /tmp/mya2rom.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/vendor/mya2rom/romanisations.js" -o /tmp/romanisations.js
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$base/models/google-burmese-wfst.json" -o /tmp/google-burmese-wfst.json
          python -c 'import json; m=json.load(open("/tmp/google-burmese-wfst.json", encoding="utf-8")); assert m["available"] is True and m["arc_count"] > 0'
          test -s /tmp/app.js && test -s /tmp/styles.css && test -s /tmp/mya2rom.js && test -s /tmp/romanisations.js && test -s /tmp/google-burmese-wfst.json
